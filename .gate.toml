# Opt-in: a bare gate skips it, gate --e2e runs it. It needs `playwright install chromium` once.
[gates.e2e]
run = "bun run test:e2e"
e2e = true
timeout = "2m"

# CI's setup-bun run-audit runs this same script; plain `bun audit` also fails on unpatched advisories.
[gates.vuln]
run = '[ -n "$CI" ] || bun /usr/local/src/com.github/Rethunk-Tech/gh-actions/audit-bun/audit.ts'
