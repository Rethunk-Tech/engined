# Dependabot PRs are signal only: the equivalent bump is applied by hand on main and the PR
# closed (fleet dependency policy). Grouped and weekly so the signal stays one PR per ecosystem.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps):"
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps):"
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /engines/chatterbox-shared
      - /engines/comfy
      - /engines/kokoro
      - /engines/llama
      - /engines/whisper
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps):"
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /engines/piper
    schedule:
      interval: weekly
      day: monday
    # onnxruntime has no cp315 wheel yet; lift when it ships one (and the hold in .repo-ops.toml).
    ignore:
      - dependency-name: python
        versions: [">=3.15"]
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps):"
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: pip
    directories:
      - /engines/chatterbox-shared
      - /engines/comfy
      - /engines/kokoro
      - /engines/piper
    schedule:
      interval: weekly
      day: monday
    # The ROCm builds come from uv --torch-backend rocm7.2 (local +rocm versions, not on PyPI), so
    # Dependabot's PyPI resolve fails; bump these by hand with the recompile.
    ignore:
      - dependency-name: torch
      - dependency-name: torchvision
      - dependency-name: torchaudio
      - dependency-name: triton-rocm
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps):"
    groups:
      all:
        patterns: ["*"]
