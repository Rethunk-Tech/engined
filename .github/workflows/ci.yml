name: ci
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile

      # Turbo keys each task on its own inputs, so a docs-only push replays
      # every check from cache instead of re-running it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      # Each check reports independently so one red does not mask the others;
      # the gate below is what actually fails the job.
      - id: lint
        run: bunx turbo run lint
        continue-on-error: true
      - id: typecheck
        run: bunx turbo run typecheck
        continue-on-error: true
      # Container-backed and agentic tests need images, a GPU and `claude` auth,
      # so they are local-only. This tier runs against a fake upstream.
      - id: test
        run: bunx turbo run test
        continue-on-error: true

      - name: gate
        if: steps.lint.outcome != 'success' || steps.typecheck.outcome != 'success' || steps.test.outcome != 'success'
        run: |
          echo "lint=${{ steps.lint.outcome }} typecheck=${{ steps.typecheck.outcome }} test=${{ steps.test.outcome }}"
          exit 1
