name: ci
on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Rethunk-Tech/gh-actions/setup-bun@5d07bd8adb2dda1caa11cacd886edf73e2e95afb # v1.10
        with:
          # Turbo keys each task on its own inputs, so a docs-only push replays
          # every check from cache instead of re-running it. The sha in the key
          # saves a fresh entry every run; the prefix restore-key is what carries
          # the previous run's entries forward. Neither can serve a stale green --
          # turbo replays an entry only when the task's input hash matches, so a
          # restored .turbo holding other hashes is inert. That leaves turbo.json's
          # `inputs` as the whole staleness boundary.
          extra-cache-paths: .turbo
          extra-cache-key: ${{ github.sha }}
      # Each check reports independently so one red does not mask the others;
      # the gate below is what actually fails the job.
      - id: lint
        run: bunx turbo run lint
        continue-on-error: true
      - id: typecheck
        run: bunx turbo run typecheck
        continue-on-error: true
      # Container-backed and agentic tests need images, a GPU and `claude` auth,
      # so they are local-only. This tier runs against a fake upstream.
      - id: test
        run: bunx turbo run test
        continue-on-error: true
      # The bundle install.sh ships is this task's output, so a break in it has
      # to be red here rather than at install time. ENGINED_COMMIT is left unset:
      # a CI bundle is never installed, and stamping it with the pushed sha would
      # miss the cache on every push including a docs-only one.
      - id: build
        run: bunx turbo run build
        continue-on-error: true

      - name: gate
        if: steps.lint.outcome != 'success' || steps.typecheck.outcome != 'success' || steps.test.outcome != 'success' || steps.build.outcome != 'success'
        run: |
          echo "lint=${{ steps.lint.outcome }} typecheck=${{ steps.typecheck.outcome }} test=${{ steps.test.outcome }} build=${{ steps.build.outcome }}"
          exit 1
