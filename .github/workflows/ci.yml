name: ci
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Rethunk-Tech/gh-actions/setup-bun@bc5fa5b1004205c9c9399fc941d79d5ada53c59b # v1.16
        with:
          # Turbo keys each task on its own inputs, so a docs-only push replays
          # every check from cache instead of re-running it. The sha in the key
          # saves a fresh entry every run; the prefix restore-key is what carries
          # the previous run's entries forward. Neither can serve a stale green --
          # turbo replays an entry only when the task's input hash matches, so a
          # restored .turbo holding other hashes is inert. That leaves turbo.json's
          # `inputs` as the whole staleness boundary.
          extra-cache-paths: .turbo
          extra-cache-key: ${{ github.sha }}
      # Each check reports independently so one red does not mask the others;
      # the gate below is what actually fails the job.
      - id: lint
        run: bunx turbo run lint
        continue-on-error: true
      - id: typecheck
        run: bunx turbo run typecheck
        continue-on-error: true
      # The bwrap sandbox is the opencode floor, so its mount-table tests run
      # here for real. Ubuntu 24.04 confines unprivileged user namespaces by
      # AppArmor, which leaves a non-setuid bwrap unable to build its sandbox.
      - name: bubblewrap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap shellcheck
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Container-backed and agentic tests need images, a GPU and `claude` auth,
      # so they are local-only. This tier runs against a fake upstream.
      - id: test
        run: bunx turbo run test
        continue-on-error: true
      # The bundle install.sh ships is this task's output, so a break in it has
      # to be red here rather than at install time. ENGINED_COMMIT is left unset:
      # a CI bundle is never installed, and stamping it with the pushed sha would
      # miss the cache on every push including a docs-only one.
      - id: build
        run: bunx turbo run build
        continue-on-error: true
      - id: actionlint
        continue-on-error: true
        run: |
          bash <(curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/rhysd/actionlint/011a6d15e749bb3f2d771eed9c7aa0e7e3e10ee7/scripts/download-actionlint.bash) \
            1.7.12 "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" .github/workflows/*.yml
      - id: shellcheck
        continue-on-error: true
        run: shellcheck packaging/deb-rpm/build.sh packaging/deb-rpm/postinstall.sh scripts/install.sh packaging/aur/release.sh engines/whisper/quiet.sh

      - name: gate
        if: steps.lint.outcome != 'success' || steps.typecheck.outcome != 'success' || steps.test.outcome != 'success' || steps.build.outcome != 'success' || steps.actionlint.outcome != 'success' || steps.shellcheck.outcome != 'success'
        run: |
          echo "lint=${{ steps.lint.outcome }} typecheck=${{ steps.typecheck.outcome }} test=${{ steps.test.outcome }} build=${{ steps.build.outcome }} actionlint=${{ steps.actionlint.outcome }} shellcheck=${{ steps.shellcheck.outcome }}"
          exit 1
