name: release

# A tag is the release: its annotation is the notes. The assets are the
# prebuilt tarball the AUR `engined` package installs from and the .deb/.rpm
# packages for x64 and arm64, so a user never builds anything; install.sh still builds from a clone checked out at the tag.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # No contents: write in this job. It runs checkout, install and the
  # compile; the token that can publish a release is deliberately not in
  # scope while any of that happens.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # A shallow checkout has the commit but not the annotated tag object the
      # notes are read from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: Rethunk-Tech/gh-actions/setup-bun@bc5fa5b1004205c9c9399fc941d79d5ada53c59b # v1.16

      # Everything packaging/aur/engined/PKGBUILD's package() reads, under one
      # top-level directory. Reproducible (sorted, fixed mtime and owner, gzip -n)
      # so a re-run uploads the same bytes the PKGBUILD's checksum names.
      - name: Build the release tarball
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          bun install --frozen-lockfile
          ENGINED_COMMIT="$GITHUB_SHA" bun run build
          stage="engined-$version"
          mkdir "$stage"
          cp -r dist engines deploy scripts docs "$stage/"
          # install.sh resolves its paths through src/paths.ts, the one definition.
          cp --parents src/paths.ts src/env.ts "$stage/"
          cp config.example.toml config.schema.json LICENSE README.md HUMANS.md THIRD_PARTY_NOTICES.md "$stage/"
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime="@$(git log -1 --format=%ct)" -cf - "$stage" | gzip -n >"$stage.tar.gz"
          tar -tzf "$stage.tar.gz" | grep -q "^$stage/dist/main.js$"
          tar -tzf "$stage.tar.gz" | grep -q "^$stage/dist/configsvc/ui/index.html$"

      # Standalone compiled binaries (Debian and Fedora do not package bun); see packaging/deb-rpm/README.md.
      - name: Build the deb and rpm packages
        env:
          TAG: ${{ github.ref_name }}
        run: |
          for arch in x64 arm64; do
            ENGINED_COMMIT="$GITHUB_SHA" packaging/deb-rpm/build.sh "$arch" packages
          done
          [ "$(find packages \( -name '*.deb' -o -name '*.rpm' \) | wc -l)" -eq 4 ]

      - name: Record the tag annotation for the publish job
        env:
          TAG: ${{ github.ref_name }}
        run: |
          subject=$(git tag -l --format='%(contents:subject)' "$TAG")
          body=$(git tag -l --format='%(contents:body)' "$TAG")
          [ -n "$subject" ] || subject=$(git log -1 --format='%s' "$TAG")
          [ -n "$body" ] || body=$(git log -1 --format='%b' "$TAG")
          printf '%s\n' "$subject" >release-subject.txt
          printf '%s\n' "${body:-$subject}" >release-notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            engined-*.tar.gz
            packages/
            release-subject.txt
            release-notes.md
          if-no-files-found: error
          retention-days: 1

  # The only job that can write to the repository, and it does nothing but
  # publish: no toolchain, no compile.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      - name: Create the GitHub release from the tag's annotation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # A re-run after the release already exists still (re)attaches the asset.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            subject=$(cat release-subject.txt)
            notes=$(cat release-notes.md)
            gh release create "$TAG" \
              --title "$TAG: $subject" \
              --notes "$notes" \
              --verify-tag
          fi
          gh release upload "$TAG" "engined-${TAG#v}.tar.gz" packages/*.deb packages/*.rpm --clobber
