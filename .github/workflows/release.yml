name: release

# A tag is the release: its annotation is the notes, and install.sh runs from a
# clone checked out at that tag, so there is no asset to attach.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A shallow checkout has the commit but not the annotated tag object the
      # notes are read from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create the GitHub release from the tag's annotation
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # A re-run after the release already exists is the desired end state.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi
          subject=$(git tag -l --format='%(contents:subject)' "$TAG")
          body=$(git tag -l --format='%(contents:body)' "$TAG")
          [ -n "$subject" ] || subject=$(git log -1 --format='%s' "$TAG")
          [ -n "$body" ] || body=$(git log -1 --format='%b' "$TAG")
          gh release create "$TAG" \
            --title "$TAG: $subject" \
            --notes "${body:-$subject}" \
            --verify-tag
