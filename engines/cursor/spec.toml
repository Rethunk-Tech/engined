kind = "agentic-cli"
# A route naming no upstream is ambient: cursor carries its own Cursor
# account login, not a configured address or secret. On the installed
# version this is also the ONLY pairing that works today --
# `CURSOR_API_KEY` is checked against Cursor's own key format client-side,
# before any network attempt, so a third-party key (e.g. openrouter's) can
# never pass it. `src/agents.ts`'s cursor entry declares no `configure` for
# exactly this reason: a route naming a real upstream would parse but fail
# every launch.
upstream = "optional"
agent = "cursor"
# The door forwards this agent's answer as it prints: `assistant` text parts over `--output-format stream-json`.
streaming = true
serves = ["/openai/v1/chat/completions"]
# PATH is here, unlike claude's: cursor's floor is a mode, not a tool
# allowlist, so its shell tool stays reachable under --mode ask --
# with no PATH a shell command it runs comes back
# "command not found", and with PATH it runs normally. Denied
# a *write*, ask mode still reads files and runs read-only shell commands.
env = ["HOME", "PATH", "BUN_INSTALL", "BUN_TMPDIR"]
