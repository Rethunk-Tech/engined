kind = "tts"
upstream = "self"
image = "engined-kokoro:local"
obtain = "build"
serves = ["/openai/v1/audio/speech"]
# KPipeline yields per segment, and app.py forwards each as an NDJSON chunk
# frame, so `"stream": true` on /openai/v1/audio/speech has boundaries to forward.
# It splits on newlines rather than sentences -- see docs/http-api.md for
# what that costs a caller that sends one long paragraph.
streaming = true
# The image's own CMD already runs uvicorn on the right host/port; no args needed.
command = []
# Full GPU_FLAGS, not the Vulkan-only pair llama takes: kokoro-rocm is
# a ROCm/PyTorch engine like the chatterbox engines and comfy. See
# engines/llama/spec.toml for why that one omits /dev/kfd.
devices = ["/dev/kfd", "/dev/dri"]
group_add = ["video"]
security_opt = ["label=disable"]
# Weights are baked into the image at build time (HF_HOME) -- no [[artifact]]
# and no model volume, same posture as the chatterbox engines.

# Persists MIOpen's on-disk kernel cache (populated by app.py's decoder
# bucket warm-up on every start) across container recreations. A plain name
# with no leading "/" is a docker-managed named volume, not a host bind mount
# -- docker creates and keeps it with no operator config needed. Without
# this, the `docker rm -f` + `docker run` engined does on every start (and
# every idle-stop restart) wipes the container's writable layer, and the
# ~1-3s-per-shape MIOpen JIT compile the warm-up just paid for is thrown away
# with it; this volume is what lets that cost amortize across restarts
# instead of being paid again every time the engine wakes up.
[[volume]]
name = "engined-kokoro-miopen-cache"
path = "/root/.cache/miopen"

# app.py's /health is a static {"status": "ok"} that never inspects the
# loaded pipeline -- but KPipeline is instantiated at module import time,
# before uvicorn binds its listening socket (uvicorn's Server.serve() loads
# the app string, running the whole module, before it creates the listen
# socket). A load failure crashes the process before the port ever opens, so
# a connect here cannot happen before the pipeline is real; app.py exposes
# no other endpoint that touches it more directly, and none was added to a
# wrapper vendored verbatim from sagaforge rather than authored here.
[ready]
path = "/health"
status = 200
