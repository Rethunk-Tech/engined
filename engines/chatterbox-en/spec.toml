kind = "tts"
upstream = "self"
image = "engined-chatterbox-en:local"
obtain = "build"
serves = ["/openai/v1/audio/speech"]
# Sentence-chunked: when the door asks for chunks, app.py runs one generate()
# per sentence and emits each as PCM before the terminal WAV frame.
streaming = true
command = []
# Full GPU_FLAGS, not the Vulkan-only pair llama takes: this is a
# ROCm/PyTorch engine like engines/chatterbox-multi. See engines/llama/spec.toml
# for why that one omits /dev/kfd.
devices = ["/dev/kfd", "/dev/dri"]
group_add = ["video"]
security_opt = ["label=disable"]
# Weights are baked into the image at build time (HF_HOME) -- no [[artifact]]
# and no model volume, unlike whisper. A different checkpoint from
# engines/chatterbox-multi: ResembleAI/chatterbox-turbo, not the multilingual model.
#
# MIOPEN_FIND_MODE=FAST is set in the Dockerfile rather than here, because
# `env` in a spec is an allowlist of host variables to forward, not a place to
# set a value -- and the setting is a property of this image's
# tuning, not of the install.

[ready]
path = "/health"
status = 200

# Where an uploaded reference voice becomes visible to this container. The
# door writes into {state_dir}/voices and hands the caller an opaque handle;
# only a handle it issued is turned back into a path under this mount, so a
# caller can never name a host file for the container to read. The container
# path here and VOICE_CONTAINER_DIR in src/audioDoor.ts are one pair.
[[volume]]
name = "{state_dir}/voices"
path = "/voices"
read_only = true
