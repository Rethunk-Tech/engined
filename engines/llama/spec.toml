kind = "openai-http"
# self, not the openai-http default of "required": this engine IS the
# upstream. A route naming none defaults to "local", never ambient or a
# configured address.
upstream = "self"
# llama.cpp has streamed on the wire all along; this simply says so. The
# door already forwards a stream for any kind (readHopBody / main.ts) --
# only the schema forbade declaring it outside tts before every kind could.
streaming = true
# engined-* tag, matching every other engine here: this engine builds from its
# own Dockerfile in this directory, so the tag has to be one no other project
# builds into. Sharing a tag with an outside workload means a rebuild here
# silently swaps the image underneath it.
image = "engined-llama-cpp:local"
obtain = "build"
serves = [
  "/openai/v1/chat/completions",
  "/openai/v1/embeddings",
  "/openai/v1/rerank",
  # Every resident GGUF answers /infill; whether it is any good at it is a
  # per-model question `fim` on the route answers, not this list's.
  "/openai/v1/completions",
]
# Vulkan device only. GPU_FLAGS (--device=/dev/kfd --device=/dev/dri
# --group-add video) is for the ROCm/PyTorch engines -- comfy, the chatterbox
# engines, kokoro -- not llama.cpp. A video-production consumer applies GPU_FLAGS whole to those three
# and, in its own llama spec, keeps --group-add video while dropping
# /dev/kfd alone -- the device node is the difference, not the group. Both
# nodes exist on this box, so the ROCm flags would run and the mistake would
# not announce itself.
devices = ["/dev/dri"]
group_add = ["video"]
# Load-bearing on Fedora: without it the container cannot open the device.
security_opt = ["label=disable"]
# --models-preset is the only channel that reaches argv per model; --models-dir
# was probed against llama.cpp b10354 and discovers one level deep by
# directory, so /v1/models returned the uploader dirname as the only id and
# the GGUF one level under it was never found. Passing both is worse: the
# same GGUF then lists twice, once with MTP and once without.
#
# MTP is per GGUF, never process-wide: `--spec-type draft-mtp` on a headless
# file exits 1, and the presets INI is the only channel that reaches argv --
# `POST /models/load` with an `args` array returned `{"success":true}` and
# left the child argv unchanged, while the same flags via the INI
# (`spec-type = draft-mtp`, `spec-draft-p-min = 0.1`) reached argv, flipped
# `/slots` to `speculative: true`, and produced `draft_n`/`draft_n_accepted`
# in the streamed timings. `p-min 0.1`, not 0.75.
#
# The draft-token-count flag is `spec-draft-n-max`, not `spec-n-max` --
# `spec-n-max` fails at router init with "option 'spec-n-max' not recognized
# in preset 'ornith'", exit 1, before the container ever answers /health.
# `--help` on the installed binary is what named the real flag. Decode
# degrades as draft acceptance falls, so raising it is a loss here; a
# published gfx1151 ladder claiming the opposite does not reproduce against
# this model. Figures, and why short-burst numbers overstate sustained decode:
# docs/tuning.md.
#
# A per-model arg is honoured per flag, not as a class: only `spec-type`,
# `spec-draft-p-min`, `embedding`, `rerank`, `ctx-size` and `parallel` are
# proven to reach argv this way -- `ctx-size` and `parallel` probed on b10637
# by setting them for ornith alone and reading back the child's argv and its
# slot geometry.
# Probe each flag the way those were probed -- set it for one model, read
# the child's argv and /slots back -- before a consumer is told it works. A
# flag that is ignored and a flag that is honoured and did nothing look
# identical from the outside.
#
# `embedding` is one of those probed flags, and its own trap: the INI key
# is `embedding`, singular, but the CLI flag it produces on the child's real
# argv is `--embeddings`, plural. Without it the embed child launches without
# the flag and every request 501s ("Start it with --embeddings"). Confirmed
# via /proc/<pid>/cmdline on the embed sub-process, then a real request
# through the door returning a vector. See config.example.toml's
# `embed` model's [model.args].
#
# `rerank` is the same trap and was proven the same way, with the control run
# the embedding probe did not have. Key `rerank`, aliases `--rerank` and
# `--reranking` on this build (`LLAMA_ARG_RERANKING`). Router mode does NOT
# autoload for this verb the way it does for chat, so the probe is: load the
# model explicitly, then call it. With the key, `/v1/rerank` answers
# `{results:[{index, relevance_score}]}` ordered correctly. Without it, the
# same loaded model answers 501 "This server does not support reranking.
# Start it with `--reranking`" -- so the endpoint's presence is per-child and
# the key is what buys it, not something the router serves regardless.
#
# An unrecognised preset key is loud, which is what makes both probes
# trustworthy: a bogus key exits 1 at router init with "option '<key>' not
# recognized in preset '<section>'", before the server listens. A key that
# parses is a key llama.cpp knows; whether it then reaches the child is the
# separate question these probes answer.
#
# `spec-draft-p-min` has its own trap the other way: the router rewrites it
# to llama-server's short alias `--draft-p-min` on the child's real argv --
# `--spec-draft-n-max` and `--spec-type` on the same child come through
# unrewritten, so this is per-flag, not a blanket `spec-`-prefix drop.
# Checking argv for the INI key's own spelling reads as "the value never
# reached the child" when it did; confirmed via /proc/<pid>/cmdline on a
# swapped-in test resident (test/local/llama.test.ts's same-role swap test),
# not just the rendered preset.
#
# POST /models/load is asynchronous: it returns status
# "loading" at once; poll until "loaded" before proxying, and that poll IS the
# `warming` state a caller sees.
# --no-models-autoload is structural, not a tunable: router mode plus
# per-role occupancy is what this engine is, and an [engine.args] key able to
# turn it off is a key able to break eviction.
# --models-max is the first-class models_max, substituted from config so an
# operator who forgets to pin it gets a fatal "unresolved placeholder" at
# spec load rather than a default that lets two 25 GB chat files stay resident.
#
# `parallel`, `ctx-size`, `cache-type-k/v` are config-level [engine.args] --
# see config.example.toml, not this file -- but both `parallel` and
# `ctx-size` are settable per model too, which is how ornith gets a window
# the other roles do not pay for. Slot geometry per `parallel` value is in
# docs/tuning.md. `-1` (auto) gives four slots sharing ONE unified pool, not
# four windows, and /slots reporting the same n_ctx on every slot is what makes
# that easy to misread. So `-np -1`'s "four slots" is a concurrency number and
# never a context number: concurrent long conversations evict each other.
#
# The ctx-halving at `-np 2` is therefore a lever, not only a footgun. It
# divides a declared ctx-size across slots, so ctx-size=262144 with
# parallel=2 is two genuinely independent 131072 windows -- what this
# config runs. KV scales with the declared total and not the slot count.
# 262144 is also this model's n_ctx_train, so none of it involves RoPE
# scaling.
#
# Watch serialization rather than memory. At parallel=1 concurrent ornith
# requests queue outright; at parallel=2 two run together and the third
# waits. Concurrent generation is slower per request than solo because the
# slots share memory bandwidth -- aggregate throughput still wins.
#
# engined's own door had no admission control against this: `activeCount`
# was uncapped, so a burst past `parallel` forwarded straight through and
# queued invisibly inside llama-server's own scheduler instead of at the
# door. `LlamaRouter.acquireLease`/`pump` (src/llama.ts) now cap a role's
# `activeCount` at this same merged `parallel`, resolved once per resident
# model and queued past that exactly like a model swap already queues --
# `parallel <= 0` (llama.cpp's `-1` auto, or the key simply unset) caps at
# the auto's four rather than running uncapped, since the
# child admits four either way and forwarding past that only moves the
# queue into llama-server's scheduler where the door cannot see it. The
# door caps; the child keeps its one unified pool.
#
# That cap now rests on a proven equality: test/local/llama.test.ts reads
# llama-server's own `GET /props?model=<id>` total_slots for the embed
# route -- whose merged parallel inherits the engine's `-1` auto rather than
# overriding it the way ornith's route.args does -- and asserts it equals
# the door's AUTO_PARALLEL (src/llama.ts). n_slots=4 is tied to the
# LLAMA_COMMIT the Dockerfile pins, and that pin is a value meant to be
# bumped. A bump that moved the auto would desynchronise the two silently,
# admitting more or fewer than the child agreed to with nothing said, so a
# LLAMA_COMMIT bump re-measures the geometry table in docs/tuning.md AND re-runs that
# assertion.
#
# One combination not measured:
# `parallel = 0` set explicitly. The door reads `<= 0` as auto and admits
# four, while `--parallel 0` reaches the child as written -- unmeasured
# ground rather than a hazard, since admitting four is tighter than
# admitting without a cap. `-1` is the spelling to use for auto.
#
# Four confirmed non-findings from that audit, so they are not
# re-investigated:
#
# Prefix caching is already on and already realized -- llama-server's
# default `cache_prompt`, no engine tunable involved (cold vs warm figures:
# docs/tuning.md). The only way to lose it is
# consumer-side: a re-serialized message array not byte-identical to the
# previous turn's tail breaks the LCP match.
#
# GPU offload is complete. `-ngl` is left at llama-server's `auto`, verified
# from the live child's real argv via `docker top`, not from this spec.
# With ornith resident the model and its KV window sit in GTT and nothing on
# CPU-only RAM. An explicit `-ngl 999` would add a line without changing
# behavior.
#
# `-b`/`-ub`/`--threads` are at defaults (2048 / 512 / auto->32) and should
# stay there. Prefill shows no starved signal; raising ubatch would only cost
# KV and compute-buffer memory for no gain.
#
# At the ~2000-token system prompts real consumers send, prefill dominates
# TTFT on any non-cache-hot turn. Do not force a model swap to measure swap
# cost -- it evicts the resident model every other consumer is using, for a
# number already on record in docs/tuning.md.
# --host 0.0.0.0 is structural, not a tunable: llama-server's own default is
# 127.0.0.1, which binds fine inside the container and passes nothing --
# docker's -p forwards to the container's interface, not its loopback, so a
# 127.0.0.1-bound child is a container that starts, is adopted, and never
# answers /health or a proxied request. With this flag absent, the
# container runs and the process listened, but every host-side connection --
# readiness poll included -- got a bare connection failure indistinguishable
# from a crashed child.
command = [
  "--host",
  "0.0.0.0",
  "--models-preset",
  "{preset_ini}",
  "--models-max",
  "{models_max}",
  "--no-models-autoload",
]

# Vision on Vulkan carries two open upstream defects, relevant to this
# engine's [model.args] mmproj/no-mmproj-offload keys even though neither is
# first-class here. One crashes llama-server on this APU; `no-mmproj-offload`
# is the workaround. The other returns the wrong image content, silently,
# and has no workaround -- a consumer gets a confident, plausible, incorrect
# description with nothing to signal it. Checked live against a three-band
# red/green/blue image with an overlaid text string, twice, including once
# concurrent with a chat request: both runs named the correct three colours
# in order and read the overlaid string correctly. A third check on b10637
# -- a two-band red/blue image, run concurrently with an ornith completion
# and an embed request -- named both colours and their vertical order
# correctly. The defect did not reproduce on this box for these model/image
# pairs, and that is three data points, not a fix upstream, so keep checking
# fidelity per consumer rather than assuming it from this comment.
#
# Model swap is seconds, not instant, scaling with file size. Idle is `docker
# stop`, not `/models/unload` alone: the resting state is no llama process,
# so unload is the swap lever, not the idle lever.
[ready]
path = "/health"
status = 200
