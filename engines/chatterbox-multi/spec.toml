kind = "tts"
upstream = "self"
image = "engined-chatterbox-multi:local"
obtain = "build"
serves = ["/openai/v1/audio/speech"]
# No `streaming` key: chatterbox-tts synthesizes in one blocking generate()
# call with no intermediate boundary to forward, so a streamed request is a
# 502 rather than a slow 200. Absent, not `false`, because absent is what
# every non-streaming spec says.
# The image's own CMD already runs uvicorn on the right host/port; no args needed.
command = []
# Full GPU_FLAGS, not the Vulkan-only pair llama takes: chatterbox-multi is a
# ROCm/PyTorch engine. See engines/llama/spec.toml for why that one
# omits /dev/kfd.
devices = ["/dev/kfd", "/dev/dri"]
group_add = ["video"]
security_opt = ["label=disable"]
# Weights are baked into the image at build time (HF_HOME) -- no [[artifact]]
# and no model volume, unlike whisper.

[ready]
path = "/health"
status = 200
