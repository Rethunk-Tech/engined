kind = "comfy"
# comfy runs here, or on some peer's `local`, and never against a foreign
# provider -- it has no dialect to speak to one.
upstream = "self"
image = "engined-comfyui:local"
obtain = "build"
# Comfy has no OpenAI shape: a consumer starts it by address (POST
# /engined/v1/start) and reaches it through the mediated proxy below, never
# through a raw container address. Every entry here is a real forwarded or
# mediated path -- nothing calls the bare form, only these sub-paths. Colon
# params, not curly braces: `{...}` is spec.toml's own placeholder syntax
# (substituted at load time against spec_dir/bunx/models_dir/...), and an
# unresolved one is a parse error -- these params are resolved by the door
# at request time, never by this loader.
serves = [
  # The one OpenAI-shaped verb comfy answers. Every other path here is the
  # mediated proxy, which stays the way a caller reaches a node graph, a
  # custom sampler or a video job -- none of which an OpenAI image request
  # can express. This is for the caller that only wants prompt to image.
  "/openai/v1/images/generations",
  "/engined/v1/comfy/:engine/:upstream/object_info/:nodeType",
  "/engined/v1/comfy/:engine/:upstream/prompt",
  "/engined/v1/comfy/:engine/:upstream/upload/image",
  "/engined/v1/comfy/:engine/:upstream/view",
  "/engined/v1/comfy/:engine/:upstream/ws",
  "/engined/v1/comfy/:engine/:upstream/history/:promptId",
  "/engined/v1/comfy/:engine/:upstream/queue",
  "/engined/v1/comfy/:engine/:upstream/system_stats",
]
# Full GPU_FLAGS, not the Vulkan-only pair llama takes: comfy is a
# ROCm/PyTorch engine. See engines/llama/spec.toml for why that one
# omits /dev/kfd -- both nodes exist on this box, so the wrong choice would
# not announce itself.
devices = ["/dev/kfd", "/dev/dri"]
group_add = ["video"]
security_opt = ["label=disable"]
# ComfyUI's default preview method is `none`, and the relay never receives a
# binary preview frame without this flag -- it fails silently, which is why
# it ships here rather than living in an operator's [engine.args].
command = ["--preview-method", "latent2rgb"]

# ComfyUI's ENTRYPOINT is exec-form, so python3 is PID 1 -- and Linux applies
# no default signal disposition to PID 1, so main.py ignores `docker stop`'s
# SIGTERM entirely and is SIGKILLed 10s later. Measured: 10.19s and exit 137
# without this, 0.128s and a clean exit 143 with it. Every other engine here
# handles SIGTERM itself and needs nothing.
init = true

# The graph the OpenAI image verb renders, resolved against this directory.
# It ships here, not in operator config, because a mis-wired node fails
# silently -- a black image, or a shape error from inside comfy that names
# no graph. What varies by install is only which checkpoints it loads, and
# those come from the comfy route's [route.args].
images_workflow = "{spec_dir}/text-to-image.json"

# engined polls this for both readiness and the idle timer: Comfy is the one
# engine whose idleness engined cannot observe from request traffic, because
# it proxies nothing for it.
[ready]
path = "/queue"
status = 200

# No [[volume]] here: the model tree is a host directory the operator already
# has, not something a docker-managed named volume should own. src/comfy.ts's
# buildComfySpec injects the real bind mount from the engine's own
# models_dir at run time, exactly as buildLlamaSpec does for llama.
