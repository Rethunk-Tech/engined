kind = "stt"
upstream = "self"
# The bare upstream image (pinned digest, still the base layer of ./Dockerfile
# below) declares no EXPOSE, and engined's port discovery has exactly one
# source: the image's own ExposedPorts. Confirmed live -- `docker image
# inspect` on the pinned digest prints `Config.ExposedPorts: null`, and
# `docker history` carries no EXPOSE layer -- so `obtain = "pull"` against
# that image directly leaves every start refusing before `docker run` with
# "exposes no ports". `./Dockerfile` adds only that missing metadata on top
# of the same pinned base.
image = "engined-whisper:local"
obtain = "build"                                                              # pull | build; build reads ./Dockerfile here
serves = ["/openai/v1/audio/transcriptions", "/openai/v1/audio/translations"]

# whisper.cpp streams. The binary this image ships does not expose it. Both
# halves have to be said, because either one alone is read as the other.
#
# The library half: `whisper_full` fires a new-segment callback as each segment
# is decoded, and whisper-cli installs that callback and prints the segment the
# moment it lands. Intermediate transcription is real, and it is real on this
# image's own binaries -- not a feature waiting upstream.
#
# The server half: examples/server/server.cpp registers exactly four handlers
# (GET /, OPTIONS + POST {inference-path}, POST /load, GET /health) and every
# one answers through `res.set_content` -- a single buffered body written after
# `whisper_full_parallel` has returned the complete transcript. There is no
# `set_chunked_content_provider` anywhere in it. On the wire, the same 121-byte
# `Content-Length` JSON comes back for a plain POST, for `stream=true`,
# `stream=1`, `response_format=stream`, `response_format=sse`, and for
# `Accept: text/event-stream`: unknown multipart fields are silently ignored,
# and no response ever carries `Transfer-Encoding: chunked`. What is missing is
# the HTTP surface, not the capability.
#
# ./whisper_app.py is that surface. It holds the exposed port, proxies the
# OpenAI verb to whisper-server on loopback untouched, and answers its own
# `POST /v1/audio/transcriptions/stream` by driving whisper-cli over the audio
# as it arrives -- a body still being uploaded is decoded four seconds at a
# time -- and forwarding each segment line as an NDJSON frame. The terminal
# frame comes from whisper-server's own answer to the completed upload, so the
# streamed transcript is the buffered one rather than a second decode beside
# it. So `streaming` is a true statement about this engine as it ships, and it
# stays true only as long as that wrapper is the entrypoint.
streaming = true

# GPU, load-bearing: ./Dockerfile now pins ghcr.io/ggml-org/whisper.cpp's
# published main-vulkan tag (see its own comment for how that was found and
# verified), so these are what the Vulkan/RADV backend actually opens at
# startup -- not the dead grant they were against the CPU-only image this
# spec ran before. The GPU is several times faster than the CPU backend at
# every clip length/model pair and the transcripts match, bar a rare
# one-word drift (figures: docs/engines.md).
#
# The divergence is not a backend being wrong. It lands on a proper name that
# both backends get equally wrong when the sentence is transcribed alone
# ("Damen Blies"); only with a long clip's context do they split, and that once
# went CPU's way. Three further long clips diverged on nothing at all. GPU
# output is deterministic across repeats, so this is a coin flip on a token the
# model is uncertain about either way, not an accuracy cost of the speedup.
devices = ["/dev/dri"]
group_add = ["video"]
security_opt = ["label=disable"]
entrypoint = ["/bin/bash", "/spec/quiet.sh"]
command = [
  "--host",
  "0.0.0.0",
  "-m",
  # medium.en by default; EngineRegistry.start rewrites this pair's second
  # token to name whichever of the two artifacts below a route's own
  # "filename" selects, and stops-and-restarts the container when the
  # running model differs from the one just requested. See [[artifact]]
  # below for both models' citation.
  "/models/ggml-medium.en-q8_0.bin",
  # --vad/-vm flag support confirmed present in the pinned digest's
  # actual whisper-server binary (strings extracted via `docker
  # create` + `docker cp`, no container ever started) -- see
  # [[artifact]] for the VAD model below for the model-source citation.
  "--vad",
  "-vm",
  "/models/ggml-silero-v6.2.0.bin",
  "--request-path",
  "",
  "--inference-path",
  "/v1/audio/transcriptions",
  "-fa",
  # 16, the box's physical core count, not 32 (SMT2 total). Thread count
  # makes no difference beyond noise at any clip length (figures:
  # docs/engines.md). Encode now runs on the GPU (see devices/group_add above), so this
  # governs only VAD and request handling. 16 is kept because it is the
  # physical core count and nothing argues against it -- not because it wins.
  "-t",
  "16",
  "--no-timestamps",
]
# --no-timestamps is not merely a print setting: it pushes <|notimestamps|>
# into the prompt, drives every timestamp token's logit to -inf, and collapses
# each 30-second decode window to one segment. On its own that would lose most
# of any recording past the first window.
#
# It does not, because --vad above splits the audio into speech segments before
# any of it is decoded, so no single decode ever spans the window. Long
# multi-sentence clips come back complete with the flag in place. Dropping it changed no content -- only segment
# boundaries, which arrive as newlines.
#
# So the flag stays, and the pairing is what makes it safe: removing --vad
# without also removing this one would start silently truncating anything
# longer than thirty seconds.
# No -l: language is a per-request field, so pinning one here would make
# changing it a wholesale spec override. medium.en and small.en below are
# English-only, so a request naming another language is decoded by an English
# model -- that is a property of the model file, not something -l could fix.
# large-v3-turbo is the multilingual one, and the only route that may declare
# `translate`.
#
# `translate` is a per-request multipart field on this server too (confirmed
# against examples/server/server.cpp: `req.has_file("translate")`), so the
# translations verb needs no second container, no restart and no flag here --
# the same loaded model answers both verbs. What it does need is the right
# weights: `--translate` against an English-only model does not error, it
# transcribes. That is why `translate` is declared per route in config rather
# than inferred from the engine, and why an undeclared route does not serve
# /openai/v1/audio/translations at all.

# a chat consumer's own probe: /health is not confirmed to exist on this image (a
# bootstrap script tries it and falls back), so readiness POSTs the real
# inference path instead. Any 2xx or 4xx proves the dialect endpoint exists --
# a missing file or invalid multipart body still answers from the route.
# 404 never counts regardless of this range: probeSaysReady excludes it
# unconditionally, since 404 is the one status that proves the route absent.
[ready]
path = "/v1/audio/transcriptions"
method = "POST"
status = 200

[ready.accept]
min = 200
max = 499

# Host bind-mount, read-only, matching llama's model-store posture: whisper
# only ever reads these files. {models_dir} resolves to this engine's
# "models_dir" config entry, so this spec is only loadable for a config that
# supplies one -- an engine that omits it fails loudly at parse, naming the
# placeholder, rather than starting with a broken mount.
[[volume]]
name = "{models_dir}"
path = "/models"
read_only = true

# quiet.sh (this repo's log filter, and what launches whisper_app.py) has to
# reach the container the same bind-mount way, and whisper_app.py beside it:
# `entrypoint` above is the fixed container path /spec/quiet.sh, which
# resolves only because this volume's
# {spec_dir} substitutes to the HOST path install.sh synced it to and mounts
# it at /spec -- run without this, the container's real PID 1 is bash
# reporting the entrypoint path "No such file or directory" and exiting
# immediately. {spec_dir} here is the same installed spec directory, so the
# mount source and the entrypoint path always agree.
[[volume]]
name = "{spec_dir}"
path = "/spec"
read_only = true

# medium.en is the accuracy end and small.en the speed end (WER and latency
# table: docs/engines.md).
#
# So the larger multilingual model is beaten on accuracy AND speed, and the
# English-only pair is the whole useful frontier: "@/whisper/medium.en" takes
# the accurate end, "@/whisper/small.en" the fast one -- two routes on this
# one engine, not two engines, since the image, models_dir and VAD file are
# all shared. Encode is the entire cost, so model size does not buy back its
# own load.
#
# q8_0 rather than a smaller quantisation: a CPU sweep
# (github.com/ggml-org/whisper.cpp discussions/3752) shows q5_0 running
# 3-5.5x slower than q4_0 while q8_0 tracks close to q4_0's speed, and
# upstream notes q8_0's quality is about q5_0's.
[[artifact]]
path = "/models/ggml-medium.en-q8_0.bin"
obtain = "curl -fL -o {models_dir}/ggml-medium.en-q8_0.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-medium.en-q8_0.bin"

# The fast end of the same frontier, above: a consumer waiting on a transcript in a loop
# names "@/whisper/small.en", and one that is not names "@/whisper/medium.en".
[[artifact]]
path = "/models/ggml-small.en-q8_0.bin"
obtain = "curl -fL -o {models_dir}/ggml-small.en-q8_0.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.en-q8_0.bin"

# The multilingual model, and the only one of the three that can translate.
# It is NOT the accuracy or speed choice for English -- it is both less
# accurate and slower than medium.en (docs/engines.md) -- so it earns its
# place on the one thing the English-only pair cannot do at all, not on the
# frontier they already cover. A box that never asks for a translation has no
# reason to download it, which is why this is an artifact with its own obtain
# line rather than a default.
[[artifact]]
path = "/models/ggml-large-v3-turbo-q8_0.bin"
obtain = "curl -fL -o {models_dir}/ggml-large-v3-turbo-q8_0.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q8_0.bin"

# Silero VAD in ggml format, published at huggingface.co/ggml-org/whisper-vad.
# Filename and URL confirmed against whisper.cpp's own
# models/download-vad-model.sh (src="https://huggingface.co/ggml-org/whisper-vad",
# pfx="resolve/main/ggml") and the README's "Voice Activity Detection (VAD)"
# section, both read from ggml-org/whisper.cpp master. v6.2.0 is the version
# both of those name as current.
[[artifact]]
path = "/models/ggml-silero-v6.2.0.bin"
obtain = "curl -fL -o {models_dir}/ggml-silero-v6.2.0.bin https://huggingface.co/ggml-org/whisper-vad/resolve/main/ggml-silero-v6.2.0.bin"
