kind = "tts"
description = "Text to speech with Piper, a small ONNX voice that runs on the CPU, so it never contends for the GPU."
homepage = "https://github.com/OHF-Voice/piper1-gpl"
upstream = "self"
image = "engined-piper:local"
obtain = "build"
serves = ["/openai/v1/audio/speech"]
# app.py splits on sentences and emits one NDJSON chunk frame per sentence,
# so `"stream": true` on /openai/v1/audio/speech has boundaries to forward.
streaming = true
# The image's own CMD already runs uvicorn on the right host/port; no args needed.
command = []
# Deliberately empty where the chatterbox engines, kokoro and comfy all carry GPU flags:
# piper is an ONNX model small enough that onnxruntime's CPU provider answers
# a sentence in well under a second, and this box has one GPU. A voice that
# never contends with a resident GGUF is the point of choosing this engine at
# all, so no devices, no group_add, and no security_opt.
devices = []
group_add = []
security_opt = []
# The image's own voice is baked in, so a box with no `models_dir` needs no
# artifact and no mount. With one, a route's `filename` names another Piper
# voice (the .onnx, its .onnx.json beside it) and the start sets this env var
# to it; app.py patches a copy of it for word timings.
route_file_env = "PIPER_VOICE_PATH"

# Dropped when the engine has no `models_dir`.
[[volume]]
name = "{models_dir}"
path = "/models"
read_only = true
optional = true

# The baked voice, from the same pinned revision as the Dockerfile's, as a worked
# example of a route's `filename`. Any voice from huggingface.co/rhasspy/piper-voices
# works: put both files in `models_dir` and name the .onnx.
[[artifact]]
path = "/models/en_US-lessac-medium.onnx"
route_file = true
obtain = "curl -fL -o {models_dir}/en_US-lessac-medium.onnx https://huggingface.co/rhasspy/piper-voices/resolve/c10ece1aade47bb51c153c893d14e5bf8e5b7117/en/en_US/lessac/medium/en_US-lessac-medium.onnx && curl -fL -o {models_dir}/en_US-lessac-medium.onnx.json https://huggingface.co/rhasspy/piper-voices/resolve/c10ece1aade47bb51c153c893d14e5bf8e5b7117/en/en_US/lessac/medium/en_US-lessac-medium.onnx.json"

# app.py's /health is a static {"status": "ok"} that never inspects the loaded
# voice -- but PiperVoice.load runs at module import, before uvicorn creates
# its listening socket, so a load failure kills the process before this port
# ever opens. A connect here cannot happen before the voice is real.
[ready]
path = "/health"
status = 200
