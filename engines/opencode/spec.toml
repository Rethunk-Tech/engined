kind = "agentic-cli"
# A route naming no upstream is ambient: opencode's own provider config
# carries the login, not an engined-configured address or secret.
upstream = "optional"
agent = "opencode"
# The door forwards this agent's answer as it prints: `text` events over `run --format json`.
streaming = true
serves = ["/openai/v1/chat/completions"]
# `run` is opencode's equivalent of `claude -p`, launched by src/agentic.ts's
# buildArgv (src/agents.ts says the argv). There is NO read-only floor in
# that argv, and that is not an omission: opencode has no tool or permission
# flag to be given one with. Its floor is the bwrap sandbox in
# src/sandbox.ts, applied in code because this agent is declared `sandbox`
# in src/agents.ts. A spec cannot opt out of it.
# PATH is here and absent from claude's: opencode resolves and executes its
# own provider package, so a child with no PATH cannot start one.
env = ["HOME", "PATH", "BUN_INSTALL", "BUN_TMPDIR"]
