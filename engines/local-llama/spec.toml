kind = "openai-http"
# engined-* tag, matching every other engine here: this engine builds from its
# own Dockerfile in this directory, so the tag has to be one no other project
# builds into. Sharing a tag with an outside workload means a rebuild here
# silently swaps the image underneath it.
image = "engined-llama-cpp:local"
obtain = "build"
serves = ["/openai/v1/chat/completions", "/openai/v1/embeddings"]
# Vulkan device only. GPU_FLAGS (--device=/dev/kfd --device=/dev/dri
# --group-add video) is for the ROCm/PyTorch engines -- comfy, chatterbox,
# kokoro -- not llama.cpp. sagaforge applies GPU_FLAGS whole to those three
# and, in its own llama spec, keeps --group-add video while dropping
# /dev/kfd alone -- the device node is the difference, not the group. Both
# nodes exist on this box, so the ROCm flags would run and the mistake would
# not announce itself.
devices = ["/dev/dri"]
group_add = ["video"]
# Load-bearing on Fedora: without it the container cannot open the device.
security_opt = ["label=disable"]
# --models-preset is the only channel that reaches argv per model; --models-dir
# was probed against llama.cpp b10354 and discovers one level deep by
# directory, so /v1/models returned the uploader dirname as the only id and
# the GGUF one level under it was never found. Passing both is worse: the
# same GGUF then lists twice, once with MTP and once without.
#
# MTP is per GGUF, never process-wide: `--spec-type draft-mtp` on a headless
# file exits 1, and the presets INI is the only channel that reaches argv --
# `POST /models/load` with an `args` array returned `{"success":true}` and
# left the child argv unchanged, while the same flags via the INI
# (`spec-type = draft-mtp`, `spec-draft-p-min = 0.1`) reached argv, flipped
# `/slots` to `speculative: true`, and produced `draft_n`/`draft_n_accepted`
# in the streamed timings. `p-min 0.1`, not 0.75.
#
# The draft-token-count flag is `spec-draft-n-max`, not `spec-n-max` --
# `spec-n-max` fails at router init with "option 'spec-n-max' not recognized
# in preset 'ornith'", exit 1, before the container ever answers /health.
# `--help` on the installed binary is what named the real flag. Measured on
# this box, warm, same prompt: n=1 gives 62.94 t/s decode at 73% draft
# acceptance, n=3 is 62.75 at 54%, n=12 collapses to 24.85 at 19% and n=16 to
# 22.30. Decode degrades monotonically as acceptance falls, so raising it is
# a loss here; a published gfx1151 ladder claiming the opposite does not
# reproduce against this model.
#
# Read that ladder as BURST numbers, because that is what they are. Draft
# acceptance decays with generation length and decode tracks acceptance
# almost exactly, so the same build measures 62.6 t/s over 32 generated
# tokens (93% acceptance), 54.3 over 128 (73%), and 54.0 over 512 (71%).
# The ladder's ORDERING is what holds; its absolute figure is a 32-token
# regime. Quote ~54 t/s for anything that generates a paragraph, and never
# compare a decode number taken over 32 tokens with one taken over 512.
#
# A per-model arg is honoured per flag, not as a class: only `spec-type`,
# `spec-draft-p-min`, `embedding`, `ctx-size` and `parallel` are proven to
# reach argv this way -- the last two probed on b10637 by setting them for
# ornith alone and reading back the child's argv and its slot geometry.
# Probe each flag the way those were probed -- set it for one model, read
# the child's argv and /slots back -- before a consumer is told it works. A
# flag that is ignored and a flag that is honoured and did nothing look
# identical from the outside.
#
# `embedding` is one of those probed flags, and its own trap: the INI key
# is `embedding`, singular, but the CLI flag it produces on the child's real
# argv is `--embeddings`, plural. Without it the embed child launches without
# the flag and every request 501s ("Start it with --embeddings"). Confirmed
# via /proc/<pid>/cmdline on the embed sub-process, then a real request
# through the door returning a 1024-length vector. See config.example.toml's
# `embed` model's [model.args].
#
# `spec-draft-p-min` has its own trap the other way: the router rewrites it
# to llama-server's short alias `--draft-p-min` on the child's real argv --
# `--spec-draft-n-max` and `--spec-type` on the same child come through
# unrewritten, so this is per-flag, not a blanket `spec-`-prefix drop.
# Checking argv for the INI key's own spelling reads as "the value never
# reached the child" when it did; confirmed via /proc/<pid>/cmdline on a
# swapped-in test resident (test/local/llama.test.ts's same-role swap test),
# not just the rendered preset.
#
# POST /models/load is asynchronous: it returned in 7 ms with status
# "loading"; poll until "loaded" before proxying, and that poll IS the
# `warming` state a caller sees.
# --no-models-autoload is structural, not a tunable: router mode plus
# per-role occupancy is what this engine is, and an [engine.args] key able to
# turn it off is a key able to break eviction.
# --models-max is the first-class models_max, substituted from config so an
# operator who forgets to pin it gets a fatal "unresolved placeholder" at
# spec load rather than a default that lets two 25 GB chat files stay resident.
#
# `parallel`, `ctx-size`, `cache-type-k/v` are config-level [engine.args] --
# see config.example.toml, not this file -- but both `parallel` and
# `ctx-size` are settable per model too, which is how ornith gets a window
# the other roles do not pay for. Measured slot geometry on b10637:
#   -1 -> n_slots=4, n_ctx_slot=32768,        kv_unified=true
#    1 -> n_slots=1, n_ctx_slot=ctx-size,     kv_unified=false
#    2 -> n_slots=2, n_ctx_slot=ctx-size / 2, kv_unified=false
#
# kv_unified=true does NOT give each of those four slots its own 32768
# window -- it gives all four ONE shared 32768 pool, and /slots reporting
# n_ctx=32768 four times is what makes that easy to misread. The footprint
# is the proof: 24.62 GiB loaded against a 23.13 GiB GGUF, where KV for
# 32768 tokens at q8_0 computes to 0.64 GiB and four independent windows
# would be 2.56 GiB on their own -- more than the entire measured overhead.
# So `-np -1`'s "four slots" is a concurrency number and never a context
# number: two concurrent 20k conversations already evict each other.
#
# The ctx-halving at `-np 2` is therefore a lever, not only a footgun. It
# divides a declared ctx-size across slots, so ctx-size=262144 with
# parallel=2 is two genuinely independent 131072 windows -- what this
# config runs. KV scales with the declared total and not the slot count:
# 262144 tokens of q8_0 KV is ~5.1 GiB, measured as a 27.20 GiB loaded
# footprint against the same GGUF. 262144 is also this model's
# n_ctx_train, so none of it involves RoPE scaling.
#
# Watch serialization rather than memory. At parallel=1 concurrent ornith
# requests queue outright (measured waits of 0.18 / 2.41 / 4.73s across
# three simultaneous requests); at parallel=2 two run together and the
# third waits. Concurrent generation is slower per request than solo
# (3.27s vs 2.06s for the same 128 tokens) because the two slots share
# memory bandwidth -- aggregate throughput still wins.
# --host 0.0.0.0 is structural, not a tunable: llama-server's own default is
# 127.0.0.1, which binds fine inside the container and passes nothing --
# docker's -p forwards to the container's interface, not its loopback, so a
# 127.0.0.1-bound child is a container that starts, is adopted, and never
# answers /health or a proxied request. Measured: with this flag absent, the
# container ran and the process listened, but every host-side connection --
# readiness poll included -- got a bare connection failure indistinguishable
# from a crashed child.
command = [
  "--host",
  "0.0.0.0",
  "--models-preset",
  "{preset_ini}",
  "--models-max",
  "{models_max}",
  "--no-models-autoload",
]

# Vision on Vulkan carries two open upstream defects, relevant to this
# engine's [model.args] mmproj/no-mmproj-offload keys even though neither is
# first-class here. One crashes llama-server on this APU; `no-mmproj-offload`
# is the workaround. The other returns the wrong image content, silently,
# and has no workaround -- a consumer gets a confident, plausible, incorrect
# description with nothing to signal it. Checked live against a three-band
# red/green/blue image with an overlaid text string, twice, including once
# concurrent with a chat request: both runs named the correct three colours
# in order and read the overlaid string correctly. A third check on b10637
# -- a two-band red/blue image, run concurrently with an ornith completion
# and an embed request -- named both colours and their vertical order
# correctly. The defect did not reproduce on this box for these model/image
# pairs, and that is three data points, not a fix upstream, so keep checking
# fidelity per consumer rather than assuming it from this comment.
#
# Model swap is seconds, not instant -- measured warm at roughly 8-16s
# across the two GGUFs on disk, scaling with file size. Idle is `docker
# stop`, not `/models/unload` alone: the resting state is no llama process,
# so unload is the swap lever, not the idle lever.
[ready]
path = "/health"
status = 200
