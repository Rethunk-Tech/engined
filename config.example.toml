# engined worked example.
#
# Copy this to $XDG_CONFIG_HOME/engined/config.toml (~/.config/engined/config.toml
# on a box with no XDG_CONFIG_HOME set) and edit it for your machine: which
# engines you actually have images for, which GGUFs you actually downloaded,
# and which agent_version you've actually proved. A config naming a file
# that isn't on disk, or an engine whose spec directory isn't installed,
# fails loudly at parse rather than starting broken -- see src/config.ts for
# the exact rules this file is validated against, and src/config-example.test.ts
# for the test that keeps this file itself honest.
#
# Every first-class key below is one of a closed set (src/config.ts's
# ENGINE_KEYS / MODEL_KEYS / UPSTREAM_KEYS / ROUTE_KEYS / CHAIN_KEYS) -- a
# typo'd key fails parse by design rather than doing nothing silently.
# Whatever isn't first-class for a given engine belongs in that engine's
# [engine.args] table; whatever isn't first-class for a given route belongs
# in that route's [route.args] table. Both reach the process argv verbatim.
#
# Five tables describe a machine. An [[upstream]] is where the bytes for a
# request come from. An [[engine]] is a way to execute a request. A [[model]]
# (optional -- declare one only where there's a capability worth recording)
# is a name with capabilities. A [[route]] pairs an engine with an upstream
# and, where one applies, a model, and carries everything specific to that
# pairing: filename, role, keep_resident, args. A [[chain]] is an ordered
# fallback list of route addresses. None of the four owns another.

listen_port           = 29200 # IANA-unassigned.
chat_timeout_seconds  = 1200  # covers a cold load of a 25 GB-class GGUF plus prefill.
                              # 600 was sized for a 32768 window; measured prefill at the
                              # wider window is 153s for 100k tokens and degrades with
                              # depth (1291 t/s at 3.5k, 654 at 100k), so a full-window
                              # request plus generation can approach the old ceiling.
agent_timeout_seconds = 3600  # an agentic CLI reading a repo runs in minutes, not seconds.

# `disable = true` on an [[engine]], [[upstream]], [[route]] or [[chain]]
# takes it out of service without deleting it. A disabled engine stays
# reported by /engined/v1/engines as `disabled` with `state = "unavailable"`
# and its routes drop; a disabled upstream drops every route naming it; a
# disabled route drops just that pairing, siblings survive; a disabled chain
# is not served at all. A chain hop whose engine, upstream or route is
# disabled drops silently out of that chain rather than failing it -- a chain
# left with no hops drops too.
#
# This box answers locally: claude, elevenlabs and openai would each send a
# prompt or a recording to someone else's GPU, so they stay declared below --
# for the day that changes -- and disabled.

# ---------------------------------------------------------------------------
# Upstreams: where the bytes for a route actually come from.
# ---------------------------------------------------------------------------

# Reserved: this box. Every route that runs here names it explicitly, and the
# id refuses `base_url` or `secret` so it can never be pointed off-machine.
[[upstream]]
id     = "local"
egress = "none"

# Moonshot serves an Anthropic-shaped endpoint, so an agentic engine built for
# Claude can be pointed at it with no protocol change. `wire = "anthropic"` is
# the whole reason the route pairing below works.
[[upstream]]
id       = "moonshot"
base_url = "https://api.kimi.com/coding/"
secret   = { service = "moonshot-api", username = "kimi-k2.7-code", header = "x-api-key" }
egress   = "remote"
wire     = "anthropic"

#   secret-tool store --label='elevenlabs-api' service elevenlabs-api username scribe
[[upstream]]
id       = "elevenlabs"
base_url = "https://api.elevenlabs.io/v1"
secret   = { service = "elevenlabs-api", username = "scribe", header = "xi-api-key" }
egress   = "remote"

# Reports unavailable, naming its own fix, until:
#   secret-tool store --label='openai-api' service openai-api username default
[[upstream]]
id       = "openai"
base_url = "https://api.openai.com/v1"
secret   = { service = "openai-api", username = "default", header = "authorization", scheme = "Bearer" }
egress   = "remote"
wire     = "openai"

# OpenRouter serves both wire shapes from one account: an OpenAI-shaped API
# at /api/v1, and an Anthropic-compatible gateway at /api that a Claude CLI
# can point at with no protocol change. One provider, two wires, two rows --
# the OpenAI-shaped one proven live end to end below; the Anthropic gateway
# stays off until a route through it gets the same proof, on a separate path.
[[upstream]]
id       = "openrouter"
base_url = "https://openrouter.ai/api/v1"
secret   = { service = "openrouter-api", username = "claude-code", header = "authorization", scheme = "Bearer" }
egress   = "remote"
wire     = "openai"

# No trailing /v1 -- the claude CLI appends /v1/messages itself.
[[upstream]]
id       = "openrouter-anthropic"
disable  = true
base_url = "https://openrouter.ai/api"
secret   = { service = "openrouter-api", username = "claude-code", header = "authorization", scheme = "Bearer" }
egress   = "remote"
wire     = "anthropic"

# ---------------------------------------------------------------------------
# llama: the one local openai-http engine, router mode over llama.cpp.
# ---------------------------------------------------------------------------

# Each engine id below resolves to engines/<id>/spec.toml, shipped with this
# repo. What's in THIS file is only what one install differs from another by
# -- image, devices and the container command live in the spec, not here.
[[engine]]
id                = "llama"
# engined expands the tilde to an absolute path for the bind mount, routing
# `~/.local/share/` through the same XDG_DATA_HOME-aware base its own install
# directory uses -- so this tree stays that directory's sibling, never inside
# it, even when XDG_DATA_HOME overrides where both live. install.sh syncs the
# install directory from the repo, and a sync must never be able to reach
# real model weights.
models_dir        = "~/.local/share/engined-models/llm"
# One per occupied role (chat, vision, embedding below) -- first-class
# because occupancy is engined's job, not llama.cpp's, and this is fatal at
# parse if it drops below the number of distinct roles actually configured.
# Below that floor, eviction silently reverts to llama's own cross-role LRU.
models_max        = 3
ready_timeout_s   = 180
idle_stop_seconds = 900

  # llama-server's own process flags. Whatever isn't first-class above lands
  # here untouched; a route's own [route.args] wins over the same key.
  [engine.args]
  parallel     = -1      # llama.cpp's auto: 4 slots sharing ONE unified ctx pool,
                          # not 4 windows of ctx-size. Fine as an engine-level
                          # default for the small roles -- the door admits against
                          # that same slot count without the child having to split
                          # its pool. ornith overrides it below to buy real
                          # context. Full reasoning: spec.toml.
  ctx-size     = 32768    # floor for any route whose own [route.args] omits it.
  cache-type-k = "q8_0"
  cache-type-v = "q8_0"
  # --no-models-autoload is NOT a config knob: router mode + per-role
  # occupancy is what this engine kind IS, and it's structural in the spec.

# `upstream` is `local` here since this engine only ever serves this box's
# own llama.cpp. `filename` must sit under the engine's models_dir and must
# actually exist on disk; both are checked at parse, not deferred to a 400 on
# first request.
[[route]]
engine   = "llama"
upstream = "local"
model    = "ornith"
filename = "gbuzhf/Ornith-1.5-35B-A3B-Abliterated-MTPv2-25G-ICE.gguf"
role     = "chat"  # chat | vision | embedding. Required: occupancy is one
                    # resident GGUF per role, so without a role models_max is
                    # just an arbitrary number with nothing to enforce.
# keep_resident = true   # Load at engine start and reload whenever this role
                         # falls idle. A different model on this role still
                         # wins the swap -- this only decides what the role
                         # returns to. Pins the container up too, since
                         # idle-stop stops the container rather than a model,
                         # so the engine's share of the pool is never returned.

  # A route's [route.args] section is the rendered llama-server preset INI
  # for that route, passed through verbatim -- the channel proven to reach
  # argv (POST /models/load's own args array is not). Omit spec-* entirely
  # on a headless (non-draft) GGUF: naming them there is llama-server exiting
  # 1 at load, and that failure isn't checkable at config parse time.
  [route.args]
  # Every chat route wants this. Without it llama-server does not use the
  # GGUF's own chat template, so its native tool-call parser is not the one in
  # play and the model's own call format -- Qwen's `<tool_call>` block, for one
  # -- can reach the client as ordinary content instead of as `tool_calls`.
  # A consumer then has a call it cannot see; a voice front-end reads the tags
  # out loud. `chat_template_kwargs` (enable_thinking) is only honoured under
  # it too. Verified in the child's argv, the same way `embedding` below was.
  jinja            = true
  spec-type        = "draft-mtp"
  spec-draft-p-min = 0.1  # measured on this box; do not copy without re-measuring yours.
  spec-draft-n-max = 1    # measured on this box: 62.94 t/s at n=1 (73% draft
                           # acceptance), 62.75 at n=3 (54%), 24.85 at n=12 (19%),
                           # 22.30 at n=16. Those are 32-token BURST figures --
                           # acceptance decays with length, so sustained is ~54 t/s.
                           # Full reasoning: engines/llama/spec.toml.
  # 262144 split across 2 slots = two independent 131072 windows. -np 2 halves
  # ctx-size per slot, which is the lever that buys them; 262144 is also this
  # model's n_ctx_train, so no RoPE scaling is involved. Costs ~5.1 GiB of q8_0
  # KV (27.20 GiB loaded against a 23.13 GiB GGUF). Two ornith requests then run
  # concurrently and a third queues.
  ctx-size         = 262144
  parallel         = 2

# Embeddings live under the same per-role occupancy as chat/vision. Picked
# for native 32768 context -- a header that declares a shorter window needs
# RoPE scaling to stretch, which is one more thing to get wrong.
[[route]]
engine   = "llama"
upstream = "local"
model    = "embed"
filename = "Qwen/Qwen3-Embedding-0.6B-GGUF/Qwen3-Embedding-0.6B-Q8_0.gguf"
role     = "embedding"

  # Without this the child launches without `--embeddings` and every
  # request 501s ("This server does not support embeddings. Start it with
  # --embeddings"). The preset INI key is `embedding`, not `embeddings` --
  # the CLI flag and the INI key are spelled differently. Confirmed live via
  # /proc/<pid>/cmdline on the embed child: this key renders as `--embeddings`
  # in its real argv, and a request through the door then returns a
  # 1024-length vector instead of 501.
  [route.args]
  embedding = true

# Vision: the GGUF and its mmproj both sit under models_dir, so the role is
# registered like any other. mmproj is an ordinary [route.args] key, not
# first-class -- check output fidelity against a known image before treating
# vision as working; a broken mmproj build can return the wrong content
# silently rather than erroring.
[[route]]
engine   = "llama"
upstream = "local"
model    = "vision"
filename = "Qwen/Qwen3-VL-8B-Instruct-GGUF/Qwen3VL-8B-Instruct-Q8_0.gguf"
role     = "vision"
vision   = "describe"  # reads a scene back in prose; see the ocr route below

  [route.args]
  # Passed through verbatim, so this is the path as the CONTAINER sees it --
  # models_dir is bind-mounted at /models, and llama does not resolve
  # mmproj relative to the model file.
  mmproj            = "/models/Qwen/Qwen3-VL-8B-Instruct-GGUF/mmproj-Qwen3VL-8B-Instruct-F16.gguf"
  no-mmproj-offload = true  # this GPU crashes llama-server on vision load without it.

# A second vision role: PaddleOCR reads a non-memorizable test string back
# character for character -- real OCR, not a captioned guess. Loads in ~1.2s
# and holds ~937 MiB in GTT (unified memory, not VRAM). ftype is BF16, so no
# quantisation caveat, and no-mmproj-offload is not needed here -- measured
# both ways, no crash either way; that flag on the route above is specific to
# Qwen3-VL's vision load on this GPU, not a general vision-route requirement.
[[route]]
engine   = "llama"
upstream = "local"
model    = "ocr"
filename = "PaddlePaddle/PaddleOCR-VL-1.6-GGUF/PaddleOCR-VL-1.6-GGUF.gguf"
role     = "vision"
# What this model does with an image, which `role` does not say: it reads the
# characters printed in one rather than describing a scene. Both kinds take an
# image and answer in text, so this is the only thing that tells them apart --
# and it is what decides which ground-truth check the vision probe sends here.
# Asked to describe the two-colour image the describe check uses, this model
# answers with degenerate repetition. Absent means "describe".
vision   = "read"

  [route.args]
  # Passed through verbatim, so this is the path as the CONTAINER sees it --
  # models_dir is bind-mounted at /models, and llama does not resolve
  # mmproj relative to the model file.
  mmproj = "/models/PaddlePaddle/PaddleOCR-VL-1.6-GGUF/PaddleOCR-VL-1.6-GGUF-mmproj.gguf"

# ---------------------------------------------------------------------------
# Agentic engines: a CLI launched with writing structurally disabled, read
# through the same openai-shaped door as everything else.
# ---------------------------------------------------------------------------

# The read-only floor (no --add-dir, no permission-bypass flags) is
# prepended by engined in code, never written here -- a file is a place it
# could be removed from. Everything else about the invocation is yours.
[[engine]]
id            = "claude"
disable       = true   # sends every prompt to Anthropic; leave off until that's wanted.
# bunx fetches exactly this pin. Whatever you put here must be a version
# YOU have proved -- engined re-runs the read-only-floor probe against a new
# pin before it will serve requests through it. Do not copy this value
# assuming it's still current; it's whatever was proved on this box when
# this example was written.
agent_version = "2.1.258"
# No [engine.args] output-format here: this agent's launch in agents.ts sets
# --output-format json unconditionally in code on every launch, so this key
# is never a real tunable -- and a config value that disagreed with it would
# silently break every parseEnvelope call, which is the same last-wins
# duplication class as the read-only floor. [engine.args] still applies to
# whatever claude flags actually ARE yours to set (max-turns, model, ...).

# A [[model]] is optional -- declared only where there's a capability worth
# recording -- and unrelated to any engine or upstream; it names nothing
# about who can reach it. Values are Anthropic's own published figures for
# this model, not a guess: input/output modalities, context window in each
# direction, and the reasoning-effort levels it accepts.
[[model]]
id          = "sonnet-5"
input       = ["text", "image"]
output      = ["text"]
context_in  = 200000
context_out = 64000
reasoning   = ["none", "low", "high"]

# No upstream: ambient means the CLI's own subscription login rather than an
# API token, and an ambient route's egress is always "remote". The model still
# reaches the CLI verbatim (it is what makes @/claude/sonnet-5 and
# @/claude/opus-5 launch different processes), so "wire_model" carries the id
# Anthropic actually serves -- measured: the CLI refuses "sonnet-5" and
# "sonnet" outright, and answers on "claude-sonnet-5".
[[route]]
engine     = "claude"
model      = "sonnet-5"
wire_model = "claude-sonnet-5"

# Moonshot serves an Anthropic-shaped endpoint, so this is the same agentic
# kind as the route above with a different upstream and a different model id
# -- not a second protocol. `k3` is passed to the CLI verbatim as the
# upstream model to run, so it has to be the name Moonshot actually serves,
# not a prettier local alias.
[[route]]
engine   = "claude"
upstream = "moonshot"
model    = "k3"

# OpenRouter's Anthropic-compatible gateway: the same agentic kind as the two
# routes above with a different upstream, the wire-compatible pairing rather
# than a protocol translation. Off because openrouter-anthropic is -- pairing
# "claude" with the OpenAI-wire "openrouter" upstream instead is a wire
# mismatch, refused at registry construction the moment the engine is
# enabled, and so is not declared here at all.
[[route]]
engine   = "claude"
upstream = "openrouter-anthropic"
model    = "sonnet-5"

# opencode is a local agentic CLI pointed back at THIS door, so a turn taken
# through it runs on the box's own GPU and is dispatched, chained and
# accounted for like every other call here. Its route names the `local`
# upstream for that reason: the prompt does not leave the machine.
#
# opencode is configured by file rather than by flags: engined writes its
# provider config pointing back at listen_port, naming the route's
# `wire_model` as the model to dial. That is why `wire_model` here is the
# qualified `@/llama/ornith` and not the route's own segment -- the segment
# names THIS route, so handing it back would point opencode at itself, and
# `dispatch.ts`'s resolveModel never falls through a bare string to an
# engine/model match. A qualified address resolves on its own, so no
# `[[chain]]` has to exist to redirect the callback.
#
# `model` names the brain rather than the job: `@/opencode/ornith` reads as
# "opencode running on ornith", and a second local brain is another route
# beside this one rather than another alias.
#
# The floor: opencode exposes NO flag that restricts its tools, and its config
# floor is overridable by an opencode.json in the workdir or any ancestor of
# it (measured -- config is discovered by walking up, and rules are
# last-wins). So engined runs it under bwrap with the workdir bound read-only,
# and refuses the launch outright if bwrap is missing. That floor stops
# writing; it does not stop reading, because the sandbox shares the host
# network namespace in order to reach this door at all.
[[engine]]
id            = "opencode"
agent_version = "1.18.26"

# The model a caller names to run an opencode task, and -- via `wire_model` --
# the address opencode is handed to dial back for its own answers.
[[route]]
engine     = "opencode"
upstream   = "local"
model      = "ornith"
wire_model = "@/llama/ornith"

# cursor's floor is a mode (--mode plan), not a tool allowlist -- measured
# clean against 2026.08.28-50f0823 in docs/security-model.md. Ambient only:
# `CURSOR_API_KEY` is checked against Cursor's own key format client-side
# before any network attempt, so no third-party upstream key can ever pass
# it (see engines/cursor/spec.toml and src/agents.ts's cursor entry) --
# every launch uses this box's own logged-in Cursor account and sends its
# prompt to Cursor's cloud, the same posture as claude, elevenlabs and
# openai above, and disabled for the same reason.
[[engine]]
id            = "cursor"
disable       = true
# Whatever pin you've actually proved on this box -- see claude's own
# comment above for what "proved" means here. This one was proved 2026-09-01.
# cursor self-updates in place, so this pin goes stale on its own schedule,
# not on yours: test:local reads it and fails loudly the moment the installed
# binary disagrees, which is the intended way to find out.
agent_version = "2026.09.03-0d34408"
# No [engine.args] output-format or mode here: cursor's launch in agents.ts
# sets --output-format stream-json and --mode plan unconditionally in code,
# so both keys are never real tunables -- assertNoForbiddenFlags refuses a
# config that tries either.

[[route]]
engine = "cursor"
model  = "composer-2.5"

# ---------------------------------------------------------------------------
# Media engines: each serves a fixed job via a modelless route
# (@/engine/upstream), selected by engine id rather than a choice of files.
# They idle longer than llama.cpp: a media model reload is cheap next to a
# 25 GB GGUF swap, and jobs arrive in bursts rather than back-to-back.
# ---------------------------------------------------------------------------

[[engine]]
id                = "chatterbox-multi"
idle_stop_seconds = 1800
# No models_dir: chatterbox-multi's weights are baked into its image at build time.
# Cold start to first audio measures ~41s against the 60s default, and that
# margin is what a sibling engine's GPU load eats first.
ready_timeout_s   = 90

[[route]]
engine   = "chatterbox-multi"
upstream = "local"

# Chatterbox Turbo, kept alongside the one above rather than replacing it: a
# different checkpoint with a one-step diffusion decoder, English-only, and
# noticeably quieter output. It runs faster than realtime where the
# multilingual engine does not; roughly half that gain is MIOPEN_FIND_MODE=FAST
# baked into this image and the rest is the model. Numbers live in one place,
# docs/engines.md, rather than being restated wherever they are relevant.
[[engine]]
id                = "chatterbox-en"
idle_stop_seconds = 1800
# ~29s cold start; same reasoning as chatterbox-multi above.
ready_timeout_s   = 90

[[route]]
engine   = "chatterbox-en"
upstream = "local"

[[engine]]
id                = "kokoro"
idle_stop_seconds = 1800
# Same posture as the chatterbox engines: weights are image-baked, nothing to mount.
# Longer than the 60s default: app.py's decoder bucket warm-up runs before
# /health can answer (see engines.md), and a cold MIOpen cache (first boot,
# or the named volume not yet populated) pays real JIT-compile time for it.
ready_timeout_s   = 120

[[route]]
engine   = "kokoro"
upstream = "local"

# The CPU voice. Same image-baked posture as the two above, and the only
# engine here that asks for no GPU at all -- which is the reason to pick it
# over kokoro or the chatterbox engines for a voice channel: it speaks while a 25 GB GGUF
# stays resident, instead of contending with it.
[[engine]]
id                = "piper"
idle_stop_seconds = 1800

[[route]]
engine   = "piper"
upstream = "local"

[[engine]]
id                = "whisper"
# Required here, unlike the chatterbox engines or kokoro: whisper's spec.toml bind-mounts
# this path read-only and its own artifact-fetch commands write into it. An
# engine that omits models_dir while its spec needs one fails loudly at spec
# load naming the unresolved placeholder -- it does not start half-broken.
models_dir        = "~/.local/share/engined-models/whisper"
idle_stop_seconds = 1800
ready_timeout_s   = 300  # whisper.cpp's own model load is slower than a container boot.

# Two model-bearing routes on the one engine rather than two engines: same
# image, same models_dir, differing only by which weights file starts the
# container -- "filename" and no "role" is stt's own disposition, checked
# once the engine's spec has loaded (engines.ts). whisper.cpp loads its model
# at container start and only one container runs per engine, so switching
# between these two is a stop-and-restart (EngineRegistry.start), refused
# with 409 while a transcription is in flight.
#
# Word error rate over 8 recorded speech clips (4.3-8.7s, known transcripts),
# median encode per clip on this box:
#
#   medium.en-q8_0   11.5% WER   2715 ms
#   small.en-q8_0    13.5% WER    929 ms
#
# so a consumer waiting on a transcript in a loop names small.en and one that
# is not names medium.en. Both are English-only; q8_0's quantisation
# reasoning is in engines/whisper/spec.toml.
[[route]]
engine   = "whisper"
upstream = "local"
model    = "medium.en"
filename = "ggml-medium.en-q8_0.bin"

[[route]]
engine   = "whisper"
upstream = "local"
model    = "small.en"
filename = "ggml-small.en-q8_0.bin"

# The remote STT engine, and the only one that is not a container. A remote
# address launches nothing, so its engine declares no models_dir and no
# idle_stop_seconds -- there is nothing to stop. Which one a caller gets is
# the route it names on /openai/v1/audio/transcriptions: "whisper" (either of
# its two models above) stays on this box, "elevenlabs" does not, and the
# upstream is what says so.
[[engine]]
id      = "elevenlabs"
kind    = "stt"       # required: with no spec directory there is nothing else to read it from.
disable = true         # sends every recording to ElevenLabs; leave off until that's wanted.

[[route]]
engine   = "elevenlabs"
upstream = "elevenlabs"
model    = "scribe_v1" # ElevenLabs' own model id, sent on the wire verbatim: the
                        # door's model segment names it directly now, so nothing
                        # forwards the engine id "elevenlabs" as a model.

[[engine]]
id                = "comfy"
# Comfy's model tree is a host directory like llama's, not baked into
# the image -- but Comfy has no OpenAI shape and no [[model]] entries here:
# it's a modelless engine, addressed only as @/comfy/local, and reached
# entirely through the mediated proxy under /engined/v1/comfy/:engine/:upstream/...
# -- never at a raw container address, and never dispatched to by a model id.
models_dir        = "~/.local/share/engined-models/comfy"
idle_stop_seconds = 1800

# `cache-lru` is what keeps a checkpoint resident across workflows, and it is
# load-bearing: comfy holds each loaded model by a WEAK reference, and the
# strong reference lives in the node-output cache, which by default retains
# only the workflow currently running. Run a second workflow and the first
# one's loader-node output is dropped, its ModelPatcher loses its last strong
# reference, and 27 GB is finalized out from under the next request.
#
# This is not a memory decision and no vram flag prevents it: measured at the
# moment it happened, comfy reported 94 GB free against the ~6 GB the incoming
# model needed, so its own free_memory() pass unloads nothing. A consumer that
# alternates image and video work in one job -- sagaforge does, per episode --
# otherwise pays a full reload on every switch back.
#
# `highvram` is kept for steady-state residency, not for that: it does NOT
# stop the eviction above, which was measured with it enabled.
#
# A smaller cost survives both flags and is worth knowing before someone
# chases it again. The FIRST image after a different workflow runs costs about
# 28s extra (171s against a settled 143s +/- 1.6s baseline over eight runs);
# the second is back to baseline and stays there. So it is one-time per
# workflow switch, not per image, and a batch amortizes it.
#
# It is NOT kernel recompilation: the extra time is spread evenly across all 26
# sampling steps (~1s each) rather than front-loaded, and comfy's logs mention
# MIOpen nowhere. The shape fits weights being partially displaced -- comfy's
# free_memory() can partially_unload a model without removing it from
# current_loaded_models, which is why no "Requested to load" line appears --
# so every step pays transfer until the next full run settles it. That last
# part is a hypothesis; the timing above is measured.
#
# Keep an [engine.args] table LAST in its block: every bare key after it
# belongs to the table, not to the engine, so a following idle_stop_seconds
# silently becomes an argv flag for the child process instead.
[engine.args]
highvram = true
"cache-lru" = 50

[[route]]
engine   = "comfy"
upstream = "local"

# A remote OpenAI-shaped engine: no spec directory, no container, nothing to
# start -- its upstream's base_url is the whole shape, the same as the remote
# STT upstream above. This is what lets a consumer stop carrying its own
# provider key and its own primary/fallback ordering: put the key on the
# upstream, name the route in a chain, and engined owns both.
[[engine]]
id      = "openai"
kind    = "openai-http"
disable = true   # sends every prompt to OpenAI; leave off until that's wanted.

  # Wire defaults for every request through this engine. A caller that sets
  # the same key in its own body wins; these only fill what it left out, and a
  # caller sending the key as an explicit null drops it from the request.
  [engine.args]
  reasoning_effort = "medium"

# Remote routes carry no filename and no role -- nothing is resident, so
# llama's occupancy rule does not apply. The model id is passed upstream
# verbatim, so it must be the name the provider actually serves.
[[route]]
engine   = "openai"
upstream = "openai"
model    = "gpt-5.4-mini"

# A second hosted id on the same engine: a consumer that needs vision through
# this door names it the way it names any other model.
[[route]]
engine   = "openai"
upstream = "openai"
model    = "gpt-5.4"

# A second remote OpenAI-shaped engine, same posture as the one above: no
# spec directory, no container. It shares its id "openrouter" with the
# upstream of the same name on purpose -- engine ids and upstream ids are
# separate namespaces, so one id can name both with no conflict.
[[engine]]
id   = "openrouter"
kind = "openai-http"

# This is the only route on "openrouter", so @/openrouter/glm-5.2:free has
# exactly one candidate and stays two-segment; a second upstream sharing this
# engine's routes would force the three-segment form instead.
#
# OpenRouter's real ids are "org/model" -- a slash the address grammar cannot
# carry, since it is the segment separator. "model" is the slash-free name
# this route is addressed by; "wire_model" is the id OpenRouter actually
# knows, sent on the wire in its place. Verified against the live catalogue:
# 425 models, 18 free, "cohere/north-mini-code:free" among them at pricing.prompt = 0.
[[route]]
engine     = "openrouter"
upstream   = "openrouter"
model      = "north-mini-code:free"
wire_model = "cohere/north-mini-code:free"

# ---------------------------------------------------------------------------
# Chains: an ordered fallback list a consumer names instead of one model.
# ---------------------------------------------------------------------------

# Private is one hop on purpose -- not a degenerate chain, but the name a
# consumer points at to say "this prompt does not leave the box". Keeping it
# a chain (rather than a bare model alias) means adding a second local
# engine later is a config edit, not a consumer change.
[[chain]]
id   = "chain-private"
hops = ["@/llama/ornith"]

[[chain]]
id   = "chain-public"
hops = [
  "@/llama/ornith",
  "@/claude/moonshot/k3",
  "@/claude/sonnet-5",
  "@/openai/gpt-5.4-mini",
]

# Speech and transcription take a chain too. This one degrades on purpose:
# chatterbox is the voice worth having, kokoro is the fallback, and piper is
# the one that still speaks when the GPU is entirely spoken for -- it asks for
# no GPU at all. A consumer names "chain-speech" once and stops caring which
# of the three is free.
#
# Every hop of an audio chain is the modelless two-segment form, because every
# TTS route here declares no model.
[[chain]]
id   = "chain-speech"
hops = ["@/chatterbox-multi/local", "@/kokoro/local", "@/piper/local"]
